name: Documentation

on:
  push:
    branches: [ 'main' ]
  workflow_call:
    inputs:
      version:
        description: The version tag (v0.1.2)
        required: false
        type: string

jobs:
  documentation:
    name: Build documentation
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      IMP_VERSION_TAG: ${{ inputs.version || 'next' }}
    if: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: '0'
          persist-credentials: false
      - name: Configure Git authentication
        run: gh auth setup-git
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: 3.x
      - run: git fetch origin gh-pages --depth=1
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
      - run: |
          pip install \
            mkdocs-material \
            mkdocs-macros-plugin \
            mike
      - name: Set version env
        if: ${{ env.IMP_VERSION_TAG != 'next' }}
        # v1.2.3 ->
        #   IMP_FULL_VERSION=1.2.3
        #   IMP_SHORT_VERSION=1.2
        #   IMP_PATCH_VERSION=2
        run: |
          version="${IMP_VERSION_TAG##*/}"
          full_version="${version#v}"
          short_version="${full_version%.*}"
          patch_version="${full_version##*.}"
          {
            printf 'IMP_FULL_VERSION=%s\n' "$full_version"
            printf 'IMP_SHORT_VERSION=%s\n' "$short_version"
            printf 'IMP_PATCH_VERSION=%s\n' "$patch_version"
          } >> "$GITHUB_ENV"
        # If it is a major or minor, we mark it as latest and default.
      - if: ${{ env.IMP_PATCH_VERSION == '0' && env.IMP_VERSION_TAG != 'next' }}
        run: |
          mike deploy --update-aliases --push "$IMP_SHORT_VERSION" latest
          mike list
        working-directory: docs
        # If it is a patch, we don't set it at latest
      - if: ${{ env.IMP_PATCH_VERSION != '0' && env.IMP_VERSION_TAG != 'next' }}
        run: |
          mike deploy --update-aliases --push "$IMP_SHORT_VERSION"
          mike list
        working-directory: docs
      - if: ${{ env.IMP_VERSION_TAG == 'next' }}
        run: |
          mike deploy --update-aliases --push next
          mike list
        working-directory: docs
      - run: |
          mike set-default --push latest
          mike list
        working-directory: docs
