name: Mutation testing

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  mutation-testing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run imp
        run: go run ./cmd/imp run --silent
