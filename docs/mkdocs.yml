site_name: imp
repo_url: https://github.com/smedijan/go-imp
edit_uri: edit/main/docs/docs
site_description: A mutation testing tool for Go.
copyright: Documentation adapted from the original project; licensed under CC BY-SA 4.0.
repo_name: smedijan/go-imp
extra_css:
  - assets/stylesheets/extra.css
theme:
  name: material
  logo: assets/images/imp-logo.png
  favicon: assets/images/favicon.png
  custom_dir: overrides
  language: en
  palette:
    primary: blue
    accent: red
  features:
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.tabs.link
    - navigation.indexes
  # Don't include MkDocs' JavaScript
  include_search_page: false
  search_index_only: true
extra:
  social:
    - icon: fontawesome/brands/github-alt
      link: https://github.com/smedijan/go-imp
      name: GitHub
  version:
    provider: mike
  release:
    full_version: !ENV [IMP_FULL_VERSION, 'X.Y.Z']
    short_version: !ENV [IMP_SHORT_VERSION, 'X.Y']

nav:
  - Home: index.md
  - Install: install.md
  - Quick start: quick-start.md
  - Usage:
      - Commands:
          - usage/commands/index.md
          - Run:
            - usage/commands/run/index.md
            - usage/commands/run/workers.md
      - usage/configuration.md
      - Mutations:
          - usage/mutations/index.md
          - usage/mutations/arithmetic_base.md
          - usage/mutations/conditionals_boundary.md
          - usage/mutations/conditionals_negation.md
          - usage/mutations/increment_decrement.md
          - usage/mutations/invert_assignments.md
          - usage/mutations/invert_bitwise.md
          - usage/mutations/invert_bitwise_assignments.md
          - usage/mutations/invert_logical.md
          - usage/mutations/invert_loop.md
          - usage/mutations/invert_negatives.md
          - usage/mutations/remove_self_assignments.md
      - Continuous integration:
          - usage/ci/github-action.md
          - usage/ci/docker.md
  - Contributing: CONTRIBUTING.md

plugins:
  - macros
  - search

markdown_extensions:

  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - meta
  - md_in_html
  - toc:
      permalink: true

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
